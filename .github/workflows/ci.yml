name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift format lint --strict --recursive Sources Tests
      - run: swift build -c release -Xswiftc -warnings-as-errors
      - run: swift test
      - name: No crash calls in app code
        run: "! grep -rnE 'fatalError|precondition\\(|unsafelyUnwrapped' Sources/"
      - run: scripts/bundle.sh
      - name: Binary size
        run: ls -l .build/release/griiy | awk '{ printf "binary: %.2f MB\n", $5 / 1048576 }' | tee -a "$GITHUB_STEP_SUMMARY"
