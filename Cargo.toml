[package]
name = "griiy"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A small, fast desktop app for reviewing pull requests, and asking why the code changed"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["git", "diff", "code-review", "pull-request"]
categories = ["development-tools", "command-line-utilities"]

[dependencies]
serde_json = "1.0.154"
tao = "0.37.1"
toml = "0.8.2"
wry = "0.57.0"
